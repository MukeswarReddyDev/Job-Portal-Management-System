
spring.application.name=JobPortal

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Resume file storage
file.upload-dir=uploads/resumes

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Initial Admin Configuration
app.admin.email=${ADMIN_EMAIL:admin@jobportal.com}
app.admin.name=${ADMIN_NAME:Job Portal Admin}
app.admin.password=${ADMIN_PASSWORD:}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
